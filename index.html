<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Natal</title>
  <meta name="description" content="Kamu diundang ke perayaan Natal. Buka undangan untuk melihat detail acara.">
  <meta name="theme-color" content="#05020d">

  <!-- Tampilan pratinjau saat link dibagikan (WhatsApp, dll) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Undangan Perayaan Natal">
  <meta property="og:description" content="Kamu diundang ke perayaan Natal. Buka untuk melihat detail acara.">

  <!-- Ikon tab (emoji pohon Natal) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bintang & salju -->
  <canvas id="snow"></canvas>

  <!-- Halaman pembuka -->
  <section id="cover" class="cover">
    <div class="cover-box">
      <p class="small">Undangan Perayaan</p>
      <h1 class="judul">Natal <span id="tahun">2026</span></h1>
      <p class="small">Kepada Yth.</p>
      <h2 id="namaTamu">Tamu Undangan</h2>
      <button id="btnBuka" class="btn" type="button">🎁 Buka Undangan</button>
    </div>
  </section>

  <!-- Isi undangan -->
  <main id="isi" class="isi hidden">

    <header class="hero">
      <div class="star">⭐</div>
      <p class="small">Dengan penuh sukacita, kami mengundang Anda</p>
      <h1 class="judul big">Perayaan Natal</h1>
      <p id="tema" class="tema">"Damai Natal di Hati Kita"</p>
    </header>

    <section class="card">
      <h3 class="judul">Hitung Mundur</h3>
      <div class="countdown">
        <div><span id="hari">0</span><small>Hari</small></div>
        <div><span id="jam">0</span><small>Jam</small></div>
        <div><span id="menit">0</span><small>Menit</small></div>
        <div><span id="detik">0</span><small>Detik</small></div>
      </div>
    </section>

    <section class="card">
      <h3 class="judul">Waktu &amp; Tempat</h3>
      <ul class="detail">
        <li>📅 <span id="tanggal">-</span></li>
        <li>🕕 <span id="waktu">-</span></li>
        <li>📍 <span id="tempat">-</span></li>
      </ul>
      <a id="btnMaps" class="btn btn-outline" href="#" target="_blank" rel="noopener">Lihat Lokasi di Peta</a>
    </section>

    <footer class="footer">
      <p class="judul salam">Selamat Natal &amp; Tahun Baru 🎄</p>
      <small id="penyelenggara">-</small>
      <br>
      <a id="btnInstagram" class="btn btn-outline" href="#" target="_blank" rel="noopener">📷 Instagram</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
